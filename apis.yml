apis:
- name: Class API
  description: 'REST API for the Class virtual classroom platform. Manage classes,
    enrollments, schedules, templates, and non-learner users; generate per-user launch
    URLs; and pull attendance and activity reporting. Authentication uses scoped API-key
    bearer tokens created in the Class admin portal; requests are versioned under
    /api/v1/ against an organization-specific base URL.'
