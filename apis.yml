aid: class-technologies
name: Class Technologies
description: 'Class Technologies Inc. builds Class, a virtual instructor-led learning
  platform that layers a full classroom experience on top of Zoom and Microsoft Teams,
  plus the web-based Class Collaborate. It gives instructors breakout rooms, whiteboards,
  polling, chat, attendance, transcription, a gradebook, engagement scoring, and deep
  LMS integration for K-12, higher education, corporate training, government (FedRAMP),
  healthcare (HIPAA), and financial services. Class exposes a REST API (developer.class.com)
  for managing classes, enrollments, schedules, templates, users, launch URLs, and
  attendance/activity reporting, secured with scoped API-key bearer tokens.'
